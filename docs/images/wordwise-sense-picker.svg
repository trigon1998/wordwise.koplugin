<text x="714" y="279" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#2c332d" font-weight="600">B1 (noun): land alongside a river</text>
<rect x="700" y="304" width="404" height="47" rx="7" fill="#fff" stroke="#d7dad4"/>
<text x="714" y="335" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#3d453e">B2 (verb): deposit money in a bank</text>
