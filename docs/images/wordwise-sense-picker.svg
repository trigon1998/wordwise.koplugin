<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Word Wise tap-to-define and multiple dictionary meanings</title>
<desc id="desc">Illustrative flow: tap an underlined word for its short meaning, then tap the bubble to open the existing Word Wise sense selection dialog with Know, Dictionary, and Cancel actions.</desc>
<defs><filter id="s" x="-15%" y="-15%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#202520" flood-opacity=".12"/></filter></defs>
<rect width="1200" height="520" rx="20" fill="#f5f5f2"/>
<rect x="32" y="32" width="528" height="454" rx="18" fill="#fff" stroke="#d8dad4" stroke-width="2"/>
<rect x="640" y="32" width="528" height="454" rx="18" fill="#fff" stroke="#d8dad4" stroke-width="2"/>
<circle cx="80" cy="80" r="25" fill="#323734"/><text x="80" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" fill="#fff">1</text>
<text x="120" y="86" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="750" fill="#313633">Tap an underlined word</text>
<text x="68" y="130" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#737a72">A short definition appears next to the word.</text>
<rect x="76" y="169" width="438" height="267" rx="14" fill="#fbfbfa" stroke="#d4d8d0"/>
<text x="101" y="208" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#343834">He was bewildered by</text>
<path d="M191 218 q4 -4 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" fill="none" stroke="#747a74" stroke-width="2"/>
<text x="101" y="242" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#343834">her sudden departure.</text>
<path d="M232 279 l13 -16 13 16" fill="#fff" stroke="#434a44" stroke-width="1.5"/>
<rect x="119" y="279" width="367" height="123" rx="11" fill="#fff" stroke="#4a504a" stroke-width="1.7" filter="url(#s)"/>
<text x="139" y="313" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#2b302d">bewildered</text>
<line x1="138" y1="327" x2="465" y2="327" stroke="#e5e7e1"/>
<text x="139" y="351" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#414741">Confused; unable to understand.</text>
<text x="139" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#7b8079">Tap for meanings / Know / Dictionary →</text>
<path d="M573 260 h53" stroke="#9c9e98" stroke-width="3" stroke-linecap="round"/>
<path d="M616 249 l12 11 -12 11" fill="none" stroke="#9c9e98" stroke-width="3" stroke-linecap="round"/>
<circle cx="689" cy="80" r="25" fill="#323734"/><text x="689" y="88" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">2</text>
<text x="730" y="86" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="750" fill="#313633">Tap the bubble for more</text>
<text x="675" y="130" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#737a72">Choose a sense or use familiar Word Wise actions.</text>
<rect x="678" y="159" width="451" height="295" rx="12" fill="#fbfbfa" stroke="#6a716b" stroke-width="1.5" filter="url(#s)"/>
