<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Three Word Wise reading levels: Basic, Intermediate, Advanced</title>
<desc id="desc">CEFR thresholds. Basic underlines A2 to C2 words; Intermediate underlines B1 to C2; Advanced underlines C1 to C2. Dark blocks indicate eligible bands.</desc>
<rect width="1200" height="440" rx="20" fill="#f5f5f2"/>
<rect x="21" y="21" width="1158" height="398" rx="17" fill="#fff" stroke="#dbddd6"/>
<text x="54" y="75" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="800" fill="#303533">One dictionary. Three reading levels.</text>
<text x="54" y="104" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#757a74">Choose how much vocabulary help you want. Dark CEFR bands are eligible for underlining.</text>
<line x1="53" y1="126" x2="1148" y2="126" stroke="#e5e6e1"/>
<text x="54" y="170" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="750" fill="#303533">Basic</text>
<text x="54" y="195" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#797d77">More vocabulary support</text>
<rect x="291" y="156" width="91" height="30" rx="15" fill="#e7e9e4"/>
<text x="336" y="176" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#525953">A2–C2</text>
<rect x="411" y="144" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="462.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">A1</text><rect x="528" y="144" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="579.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">A2</text><rect x="645" y="144" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="696.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">B1</text><rect x="762" y="144" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="813.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">B2</text><rect x="879" y="144" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="930.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C1</text><rect x="996" y="144" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="1047.5" y="180" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C2</text>
<line x1="53" y1="217" x2="1148" y2="217" stroke="#ededeb"/>
<text x="54" y="261" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="750" fill="#303533">Intermediate</text>
<text x="54" y="286" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#797d77">Balanced assistance</text>
<rect x="291" y="247" width="91" height="30" rx="15" fill="#e7e9e4"/>
<text x="336" y="267" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#525953">B1–C2</text>
<rect x="411" y="235" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="462.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">A1</text><rect x="528" y="235" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="579.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">A2</text><rect x="645" y="235" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="696.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">B1</text><rect x="762" y="235" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="813.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">B2</text><rect x="879" y="235" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="930.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C1</text><rect x="996" y="235" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="1047.5" y="271" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C2</text>
<line x1="53" y1="308" x2="1148" y2="308" stroke="#ededeb"/>
<text x="54" y="352" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="750" fill="#303533">Advanced</text>
<text x="54" y="377" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#797d77">Only higher-level words</text>
<rect x="291" y="338" width="91" height="30" rx="15" fill="#e7e9e4"/>
<text x="336" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#525953">C1–C2</text>
<rect x="411" y="326" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="462.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">A1</text><rect x="528" y="326" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="579.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">A2</text><rect x="645" y="326" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="696.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">B1</text><rect x="762" y="326" width="103" height="57" rx="11" fill="#e9eae6" stroke="#dadbd6"/><text x="813.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#989c95">B2</text><rect x="879" y="326" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="930.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C1</text><rect x="996" y="326" width="103" height="57" rx="11" fill="#323734" stroke="#323734"/><text x="1047.5" y="362" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff">C2</text>
