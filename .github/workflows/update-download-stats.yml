name: Update download statistics

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-download-chart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Update chart from GitHub Releases API
        run: python3 tools/update_download_chart.py

      - name: Commit changed statistics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-stats.json download-stats.svg
          if git diff --cached --quiet; then
            echo "Download statistics are already current."
          else
            git commit -m "Update download statistics"
            git push
          fi
